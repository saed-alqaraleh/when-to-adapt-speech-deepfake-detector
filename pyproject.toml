[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pga-g-speech-detection"
version = "1.0.0"
description = "Prevalence-gated adaptation, consistency screening and conformal calibration"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "docs/SOFTWARE_TERMS.txt"}
dependencies = ["numpy>=1.26,<3", "pandas>=2.1,<3", "scikit-learn>=1.3,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["pga_g*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
